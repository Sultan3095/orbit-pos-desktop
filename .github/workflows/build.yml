name: Build installers
on:
  workflow_dispatch:
    inputs:
      all:
        description: 'Also build macOS and Linux'
        default: 'false'
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.all == 'true' && '["windows-latest","macos-latest","ubuntu-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-pos-${{ matrix.os }}
          path: dist/*
